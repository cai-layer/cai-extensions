# cai-extension
name: Quick Reminder
description: Create an Apple Reminder from clipboard text
author: cai-layer
version: "1.0"
tags: [productivity, reminders]
icon: checklist
type: shell
shell: |
  osascript -e 'on run argv
    tell application "Reminders" to make new reminder with properties {name:item 1 of argv}
    tell application "Reminders" to activate
  end run' -- {{result}} && echo "Reminder created"
